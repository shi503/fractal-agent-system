# Decision Ledger v2 — Schema Definition
#
# This file is the single source of configuration for all entry types, status values,
# layer identifiers, and RACI constraints. Adding a new entry type is a YAML edit here;
# no code change is required (FM-5 guard — see README.md).
#
# Version: 1.0.0
# Schema language: YAML (validation at write-time by validate CLI)
# Canonical path: tools/decision-ledger/schema/schema.yaml

meta:
  version: "1.0.0"
  updated: "2026-06-04"
  description: >
    Validation rules for Decision Ledger v2 markdown entries.
    Markdown files are canonical; SQLite is a derived index only.

# ---------------------------------------------------------------------------
# FM-5 GUARD: To add a new entry type, add an entry to this list.
# Do not change the validate CLI or any other code.
# Each new type must provide: id_pattern, id_label, required_fields, optional_fields.
# ---------------------------------------------------------------------------
entry_types:
  discovery:
    description: "Discovery items — open questions or decision inputs. ID format: D-NNNN (up to 4 digits, zero-padded, with an optional lowercase-letter suffix)."
    id_pattern: "^D-[0-9]{1,4}[a-z]?$"
    id_label: "D-NNNN"
    required_fields:
      - id
      - type
      - title
      - owner
      - status
      - raci
      - created
      - updated
      - created_by
      - updated_by
    optional_fields:
      - layer
      - answer
      - superseded_by
      - cross_refs
      - tags
      - addenda

  critical_decision:
    description: "Critical decisions — binary, high-impact, gates progress. ID format: CD-NNN (up to 3 digits)."
    id_pattern: "^CD-[0-9]{1,3}$"
    id_label: "CD-NNN"
    required_fields:
      - id
      - type
      - title
      - owner
      - status
      - raci
      - created
      - updated
      - created_by
      - updated_by
    optional_fields:
      - layer
      - options
      - answer
      - rationale
      - superseded_by
      - cross_refs
      - tags
      - addenda

  big_idea:
    description: "Big ideas — strategic levers unlocking multiple items. ID format: BI-NNN (up to 3 digits)."
    id_pattern: "^BI-[0-9]{1,3}$"
    id_label: "BI-NNN"
    required_fields:
      - id
      - type
      - title
      - owner
      - status
      - raci
      - created
      - updated
      - created_by
      - updated_by
    optional_fields:
      - layer
      - unlocks
      - answer
      - superseded_by
      - cross_refs
      - tags
      - addenda

  layer_item:
    description: >
      Layer-scoped tasks or decisions. ID format: L{layer_number}-NN[suffix]
      where suffix is an optional lowercase letter (e.g., L2-01a).
    id_pattern: "^L[0-9]{1,2}-[0-9]{1,2}[a-z]?$"
    id_label: "L#-NN"
    required_fields:
      - id
      - type
      - layer
      - title
      - owner
      - status
      - raci
      - created
      - updated
      - created_by
      - updated_by
    optional_fields:
      - answer
      - superseded_by
      - cross_refs
      - tags
      - addenda

# ---------------------------------------------------------------------------
# Status enum
# Maps the six v1 emoji markers to structured string values.
# Emojis are preserved in rendered views only; canonical value is the string.
# ---------------------------------------------------------------------------
status_values:
  open:
    description: "Not yet addressed."
    v1_emoji: "🔴"
  in_discovery:
    description: "Partially explored; active investigation underway."
    v1_emoji: "🟡"
  answered:
    description: "Decision recorded by R or A contributor."
    v1_emoji: "🟢"
  conflicted:
    description: "Contradictory answers from multiple contributors; requires R/A decider."
    v1_emoji: "🔶"
  pending_signoff:
    description: "Answered but awaiting executive or lead ratification. Does not block implementation."
    v1_emoji: "🔵"
  deferred:
    description: "Out of scope for the current planning window."
    v1_emoji: "⚫"

# Allowed values list for validators (derived from keys above)
allowed_statuses:
  - open
  - in_discovery
  - answered
  - conflicted
  - pending_signoff
  - deferred

# ---------------------------------------------------------------------------
# Layer enum
# Configurable — add new layers here without code changes.
# ---------------------------------------------------------------------------
layers:
  L1:
    name: "Strategy"
    description: "Business narrative, targets, positioning, kill criteria."
  L2:
    name: "Product"
    description: "What users need, MVP workflows, scope, trade-off authority."
  L3:
    name: "Delivery"
    description: "Delivery plan, sprint sequencing, team allocation, milestone gates."
  L4:
    name: "Technical"
    description: "Architecture, APIs, data model, infrastructure, service boundaries."
  L5:
    name: "Design/UX"
    description: "User experience, accessibility, interaction patterns, UX testing."
  L6:
    name: "Go-to-Market"
    description: "Launch motion, pricing, marketing, acquisition strategy."
  L7:
    name: "Legal & Compliance"
    description: "Terms of service, privacy, licensing, data retention."
  L8:
    name: "Support & Operations"
    description: "Support model, SLA, monitoring, on-call, feedback loop."
  L9:
    name: "Engineering Operations"
    description: "CI/CD, tooling decisions, shared infra, internal frameworks."
  L10:
    name: "Platform Integrations"
    description: "Third-party integrations, partner APIs, embedded services."
  L11:
    name: "AI & Agents Strategy"
    description: "AI strategy, agent tooling, vector search, cost tracking."

allowed_layers:
  - L1
  - L2
  - L3
  - L4
  - L5
  - L6
  - L7
  - L8
  - L9
  - L10
  - L11

# ---------------------------------------------------------------------------
# RACI sub-schema
# All initials must resolve against people.yaml.
# `responsible` must be non-empty (FM-4 guard against unowned decisions).
# ---------------------------------------------------------------------------
raci:
  fields:
    responsible:
      description: "Who does the work / makes the call. Must have at least one person."
      min_count: 1
      max_count: 5
      required: true
    accountable:
      description: "Who is ultimately answerable; ratifies the decision. Optional (defaults to responsible if omitted)."
      min_count: 0
      max_count: 3
      required: false
    consulted:
      description: "Whose input is sought before a decision is made. Optional."
      min_count: 0
      max_count: 10
      required: false
    informed:
      description: "Who is kept in the loop after a decision is made. Optional."
      min_count: 0
      max_count: 20
      required: false

# ---------------------------------------------------------------------------
# Audit fields
# Required on every entry; validated as ISO-8601 datetime strings.
# ---------------------------------------------------------------------------
audit_fields:
  created:
    type: "iso8601_datetime"
    required: true
    description: "Timestamp when the entry was first created."
  updated:
    type: "iso8601_datetime"
    required: true
    description: "Timestamp of the most recent update."
  created_by:
    type: "initials"
    required: true
    description: "Initials of the person who created the entry (must resolve against people.yaml)."
  updated_by:
    type: "initials"
    required: true
    description: "Initials of the person who last updated the entry (must resolve against people.yaml)."

# ---------------------------------------------------------------------------
# Field type definitions (used by validate CLI)
# ---------------------------------------------------------------------------
field_types:
  iso8601_datetime:
    description: "ISO 8601 datetime string, UTC preferred."
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(Z|[+-][0-9]{2}:[0-9]{2})$"
    examples:
      - "2026-04-22T14:31:00Z"
      - "2026-04-26T09:15:00+00:00"
  initials:
    description: "2–4 uppercase letters matching a key in people.yaml."
    pattern: "^[A-Z]{2,4}$"
    examples:
      - "AR"
      - "RV"
      - "TN"
